<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Tap-to-flip 2026 midterm prediction maps: Senate, House, and NYC & Orange County races, with polls and share codes.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<title>Midterm Map 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: profile bar, scope + race tabs, broadcast seat bar, layer switches, map (state tiles or borough cards), detail, ballot list, compare */
:root{
  --bg:#f2f3f6; --surface:#ffffff; --fg:#141821; --muted:#5b6372; --line:#d6dae3;
  --dem:#1f5fd1; --rep:#d1392b; --ind:#7a4ec8; --oth:#7d8594; --toss:#cdd1da; --toss-fg:#2a2f3a;
  --focus:#c88a10; --empty:#e6e8ee;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1117; --surface:#171b23; --fg:#e8ebf1; --muted:#98a1b0; --line:#2a303b;
  --dem:#4a84ef; --rep:#ee5747; --ind:#9c78e5; --oth:#8a93a3; --toss:#3a404c; --toss-fg:#d7dbe3;
  --focus:#e3a93a; --empty:#1d222b; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e1117; --surface:#171b23; --fg:#e8ebf1; --muted:#98a1b0; --line:#2a303b;
  --dem:#4a84ef; --rep:#ee5747; --ind:#9c78e5; --oth:#8a93a3; --toss:#3a404c; --toss-fg:#d7dbe3;
  --focus:#e3a93a; --empty:#1d222b; color-scheme:dark }

body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-direction:column;gap:4px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,8vw,44px);line-height:1;margin:0;letter-spacing:.01em;text-wrap:balance}
a{color:inherit}
button{font-family:inherit}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* profile bar */
.who{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.who .lbl{flex:none}
.who select,.who input{font:600 14px var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 8px;min-width:0}
.who select{flex:1 1 180px}
.who .rename{flex:1 1 140px}
.who .lock{font-size:12px;color:var(--muted);width:100%}

.scope{display:grid;grid-template-columns:1fr 1fr;gap:4px;border-bottom:1px solid var(--line)}
.scope button{border:0;background:none;color:var(--muted);font:700 15px var(--body);padding:8px 4px 10px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.scope button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg)}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;gap:4px}
.tab{font-family:var(--display);font-size:clamp(15px,4vw,20px);font-weight:700;letter-spacing:.02em;border:0;border-radius:7px;padding:8px 2px;background:transparent;color:var(--muted);cursor:pointer;line-height:1.1}
.tab[aria-selected="true"]{background:var(--fg);color:var(--bg)}

.tally{display:flex;flex-direction:column;gap:8px}
.nums{display:flex;justify-content:space-between;align-items:flex-end;font-variant-numeric:tabular-nums;gap:8px}
.side{display:flex;flex-direction:column;min-width:0}
.side.r{align-items:flex-end;text-align:right}
.big{font-family:var(--display);font-weight:700;font-size:clamp(40px,12vw,58px);line-height:.9}
.side.d .big{color:var(--dem)} .side.r .big{color:var(--rep)}
.lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mid{text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;padding-bottom:4px}
.mid .n{font-family:var(--display);font-weight:700;font-size:26px;line-height:1}
.bar{position:relative;height:22px;border-radius:5px;overflow:hidden;display:flex;background:var(--toss)}
.bar span{height:100%;transition:width .25s ease}
.seg-d{background:var(--dem)} .seg-i{background:var(--ind)} .seg-t{background:var(--toss)} .seg-r{background:var(--rep)}
.seg-hold{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.28) 0 3px,transparent 3px 7px)}
.marker{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg);left:50%;transform:translateX(-1px)}
.bar-wrap{position:relative;padding-block:4px}
.status{font-size:13px;color:var(--muted);text-align:center;min-height:1.4em}
.status b{color:var(--fg)}

.layers{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.layer{display:inline-flex;align-items:center;gap:7px;font:600 13px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 12px 6px 8px;cursor:pointer}
.layer .sw{width:28px;height:16px;border-radius:999px;background:var(--toss);position:relative;transition:background .2s}
.layer .sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--surface);transition:transform .2s}
.layer[aria-pressed="true"]{color:var(--fg);border-color:var(--fg)}
.layer[aria-pressed="true"] .sw{background:var(--fg)}
.layer[aria-pressed="true"] .sw::after{transform:translateX(12px);background:var(--bg)}

/* national tile grid */
.map{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:repeat(8,auto);gap:4px}
.tile{aspect-ratio:1;max-width:100%;border:0;border-radius:4px;padding:0;cursor:pointer;position:relative;overflow:hidden;
  font-family:var(--display);font-weight:700;font-size:clamp(11px,2.6vw,17px);letter-spacing:.02em;
  display:flex;align-items:center;justify-content:center;color:var(--toss-fg);background:var(--toss);
  transition:background .2s ease,transform .1s ease;-webkit-tap-highlight-color:transparent}
.tile:active{transform:scale(.93)}
.tile.D{background:var(--dem);color:#fff} .tile.R{background:var(--rep);color:#fff} .tile.I{background:var(--ind);color:#fff}
.tile.mixed{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.tile.none{background:var(--empty);color:var(--muted);cursor:default;box-shadow:inset 0 0 0 1px var(--line)}
.tile.sel{box-shadow:0 0 0 3px var(--focus)}
.pip{position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;box-shadow:0 0 0 1.5px var(--surface)}
.pip.D{background:var(--dem)} .pip.R{background:var(--rep)} .pip.I{background:var(--ind)}
.tile.D .pip,.tile.R .pip,.tile.I .pip,.tile.mixed .pip,.lt.D .pip,.lt.R .pip,.lt.I .pip{box-shadow:0 0 0 1.5px rgba(255,255,255,.9)}
.star{position:absolute;bottom:1px;left:0;right:0;font-size:8px;line-height:1;font-family:var(--body);font-weight:600;text-shadow:none}
.mg{position:absolute;bottom:1px;left:0;right:0;font:700 8px var(--body);line-height:1.1;text-shadow:none;letter-spacing:0}
.lt .mg{position:static;font-size:10px}
.cnt{position:absolute;top:2px;left:3px;font-size:9px;font-family:var(--body);font-weight:600;opacity:.9}
.strip{position:absolute;left:0;right:0;bottom:0;height:4px;display:flex}
.strip span{height:100%}
.strip .d{background:var(--dem)} .strip .r{background:var(--rep)} .strip .i{background:var(--ind)} .strip .v{background:var(--oth)}
.tile.D .strip,.tile.R .strip,.tile.I .strip,.tile.mixed .strip{box-shadow:0 -1px 0 rgba(255,255,255,.8)}

/* local region cards */
.regions{display:grid;grid-template-columns:1fr 1fr;gap:10px;grid-template-areas:"orange bronx" "manhattan queens" "si brooklyn"}
.regions.solo{grid-template-columns:1fr;grid-template-areas:"orange"}
.regions.wide{grid-template-columns:1fr;grid-template-areas:"orange" "bronx" "manhattan" "queens" "brooklyn" "si"}
.region{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.region h2{font-family:var(--display);font-weight:700;font-size:22px;margin:0;line-height:1}
.region .cty{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ltiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.regions.wide .ltiles{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.lt{position:relative;aspect-ratio:1;max-width:100%;border:0;border-radius:6px;cursor:pointer;padding:4px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;
  background:var(--toss);color:var(--toss-fg);transition:background .2s ease,transform .1s ease;-webkit-tap-highlight-color:transparent}
.lt:active{transform:scale(.95)}
.lt.D{background:var(--dem);color:#fff} .lt.R{background:var(--rep);color:#fff} .lt.I{background:var(--ind);color:#fff}
.lt.sel{box-shadow:0 0 0 3px var(--focus)}
.lt .num{font-family:var(--display);font-weight:700;font-size:20px;line-height:1}
.lt .tag{font-size:9px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;opacity:.9;line-height:1.1}
.lt .who2{font-size:12px;font-weight:600;line-height:1.2}
.regions.wide .lt{aspect-ratio:auto;min-height:62px;align-items:flex-start;text-align:left;padding:8px 10px}
.fn{font-size:12px;color:var(--muted);line-height:1.4}

.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px;box-shadow:inset 0 0 0 1px var(--line)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:600 13px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-family:var(--display);font-weight:700;font-size:26px;margin:0;line-height:1}
.panel h3{font-family:var(--display);font-weight:700;font-size:21px;margin:0;line-height:1}
.sub{font-size:13px;color:var(--muted)}
.kv{display:flex;flex-direction:column;gap:6px}
.sec{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cands{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.cand{display:flex;align-items:baseline;gap:8px;font-size:14px;flex-wrap:wrap}
.cand .ln{font-size:12px;color:var(--muted)}
.badge{flex:none;font:700 11px var(--body);color:#fff;border-radius:4px;padding:2px 6px;min-width:22px;text-align:center;align-self:center}
.badge.D{background:var(--dem)} .badge.R{background:var(--rep)} .badge.I{background:var(--ind)} .badge.O{background:var(--oth)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.seg button{font:600 13px var(--body);border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:7px;padding:9px 4px;cursor:pointer}
.seg button[aria-pressed="true"].D{background:var(--dem);border-color:var(--dem);color:#fff}
.seg button[aria-pressed="true"].R{background:var(--rep);border-color:var(--rep);color:#fff}
.seg button[aria-pressed="true"].I{background:var(--ind);border-color:var(--ind);color:#fff}
.seg button[aria-pressed="true"].T{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.hbar{height:10px;border-radius:3px;overflow:hidden;display:flex;background:var(--toss)}
.hbar span{height:100%}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.step{border:1px solid var(--line);border-radius:10px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--bg)}
.step .v{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.step.D .v{color:var(--dem)} .step.R .v{color:var(--rep)} .step.I .v{color:var(--ind)}
.step .pm{display:flex;gap:6px}
.step .pm button{width:38px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:700 18px var(--body);cursor:pointer}
.step .pm button:disabled{opacity:.35;cursor:default}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.link{font-size:13px;font-weight:600;text-decoration:underline;text-underline-offset:2px}

.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:start;padding:10px 0;border:0;border-top:1px solid var(--line);cursor:pointer;background:none;text-align:left;color:inherit;font:inherit;width:100%}
.row:first-child{border-top:0}
.row .ab{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.1}
.row .names{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:13.5px;min-width:0}
.row .names span{display:inline-flex;align-items:center;gap:5px}
.row .meta{font-size:12px;color:var(--muted);width:100%}
.pk{font:700 11px var(--body);border-radius:4px;padding:2px 6px;background:var(--toss);color:var(--toss-fg);white-space:nowrap}
.pk.D{background:var(--dem);color:#fff} .pk.R{background:var(--rep);color:#fff} .pk.I{background:var(--ind);color:#fff}
.row.sel .ab{color:var(--focus)}
.dotc{width:8px;height:8px;border-radius:50%;flex:none}
.dotc.D{background:var(--dem)} .dotc.R{background:var(--rep)} .dotc.I{background:var(--ind)} .dotc.O{background:var(--oth)}
.flips{display:flex;flex-wrap:wrap;gap:6px}
.flip{font:600 12px var(--body);padding:4px 8px;border-radius:999px;color:#fff}
.flip.D{background:var(--dem)} .flip.R{background:var(--rep)} .flip.I{background:var(--ind)}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 12px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.cmp .h{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cmp .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmp .nm.act{color:var(--focus)}
.cmp button{all:unset;cursor:pointer}
.cmp button:focus-visible{outline:3px solid var(--focus)}
textarea.code{width:100%;box-sizing:border-box;min-height:70px;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px;resize:vertical;word-break:break-all}
.ptab{display:flex;flex-direction:column}
.pr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.pr:first-child{border-top:0}
.pr .src{font-weight:600}
.pr .dt{font-size:12px;color:var(--muted)}
.pr .res{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:2px 12px;font-variant-numeric:tabular-nums}
.pr .res span{display:inline-flex;align-items:center;gap:5px}
.pr a{font-size:12px}
.lead{font:700 11px var(--body);border-radius:4px;padding:2px 6px;color:#fff;white-space:nowrap;align-self:start}
.lead.D{background:var(--dem)} .lead.R{background:var(--rep)} .lead.I{background:var(--ind)} .lead.O{background:var(--oth)} .lead.T{background:var(--toss);color:var(--toss-fg)}
.avgbox{display:flex;flex-direction:column;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
.note{font-size:12.5px;color:var(--muted);max-width:65ch;margin:0}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);
  font-size:13px;font-weight:600;padding:9px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px);z-index:5}
.toast.on{opacity:1}
@media (max-width:380px){.ltiles{grid-template-columns:repeat(auto-fill,minmax(46px,1fr))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">Election Day · Tuesday, Nov 3, 2026</div>
    <h1>Midterm Map 2026</h1>
  </header>

  <div class="who">
    <span class="lbl">Map of</span>
    <select id="who-select" aria-label="Whose predictions"></select>
    <input id="who-name" class="rename" maxlength="24" aria-label="Name for this map" placeholder="Name this map">
    <div class="lock" id="who-lock"></div>
  </div>

  <div class="scope" role="tablist">
    <button id="scope-nat" role="tab" data-scope="nat">National</button>
    <button id="scope-loc" role="tab" data-scope="loc">NYC &amp; Orange County</button>
  </div>
  <div class="tabs" role="tablist" id="tabs"></div>

  <section class="tally" aria-live="polite">
    <div class="nums">
      <div class="side d"><span class="big" id="n-d">0</span><span class="lbl" id="l-d">Democrats</span></div>
      <div class="mid"><span class="n" id="n-t">0</span><span class="lbl" id="t-lbl">Toss-up</span></div>
      <div class="side r"><span class="big" id="n-r">0</span><span class="lbl" id="l-r">Republicans</span></div>
    </div>
    <div class="bar-wrap"><div class="bar" id="bar"></div><div class="marker" id="marker"></div></div>
    <div class="status" id="status"></div>
  </section>

  <div class="layers" role="group" aria-label="Map layers">
    <span class="lbl">Layers</span>
    <button class="layer" id="layer-held" aria-pressed="true"><span class="sw"></span>Seat held by</button>
    <button class="layer" id="layer-ballot" aria-pressed="true"><span class="sw"></span>On the ballot</button>
    <button class="layer" id="layer-polls" aria-pressed="true"><span class="sw"></span>Polls</button>
  </div>

  <div id="mapbox"></div>
  <div class="legend" id="legend"></div>
  <div id="detail"></div>
  <div class="actions" id="actions"></div>
  <div id="extra"></div>
  <div id="polls"></div>
  <div id="ballot"></div>
  <div id="compare"></div>
  <div id="share"></div>
  <p class="note" id="note"></p>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ===================== DATA ===================== */

/* ===================== POLLS ===================== */
const GENERIC_C=[["Democrats","D"],["Republicans","R"]];
function partyIn(cands,key){const k=String(key).toLowerCase();
  const c=(cands||[]).find(c=>c[0].toLowerCase().includes(k)||k.includes(lastName(c[0]).toLowerCase()));
  return c?c[1]:(/^dem/i.test(key)?"D":/^rep|^gop/i.test(key)?"R":/undecided|other/i.test(key)?"X":"O")}
function ownAvg(polls){const sum={},cnt={};for(const p of polls)for(const k in p.r){const v=+p.r[k];if(isFinite(v)){sum[k]=(sum[k]||0)+v;cnt[k]=(cnt[k]||0)+1}}
  const r={},need=Math.max(1,Math.ceil(polls.length/2));for(const k in sum)if(cnt[k]>=need)r[k]=Math.round(sum[k]/cnt[k]*10)/10;return Object.keys(r).length?r:null}
function lead(res,cands){const e=Object.entries(res||{}).filter(([k,v])=>isFinite(+v)&&partyIn(cands,k)!=="X").map(([k,v])=>[k,+v]).sort((a,b)=>b[1]-a[1]);if(e.length<2)return null;
  const by=Math.round((e[0][1]-e[1][1])*10)/10;return {party:by===0?"T":pcls(partyIn(cands,e[0][0])),name:e[0][0],by}}
function combined(avgs){const sum={},cnt={};for(const a of avgs)for(const k in a.r){const v=+a.r[k];if(isFinite(v)){sum[k]=(sum[k]||0)+v;cnt[k]=(cnt[k]||0)+1}}
  const r={};for(const k in sum)if(cnt[k]===avgs.length||cnt[k]>=Math.ceil(avgs.length/2))r[k]=Math.round(sum[k]/cnt[k]*10)/10;return r}
function topline(e,cands){if(!e)return null;
  if(e.avg&&e.avg.length){const r=e.avg.length>1?combined(e.avg):e.avg[0].r;
    return {src:e.avg.length>1?`Combined: ${e.avg.length} published averages`:e.avg[0].s,date:e.avg.length>1?"":e.avg[0].d,res:r,lead:lead(r,cands)}}
  if(e.polls&&e.polls.length){const r=ownAvg(e.polls);if(r)return {src:`Average of ${e.polls.length} listed poll${e.polls.length>1?"s":""}`,res:r,lead:lead(r,cands),own:true}}
  return null}
const mgText=l=>!l?"":l.party==="T"?"Tied":`${l.party==="O"?"Oth":l.party}+${l.by}`;
function resHTML(res,cands){return Object.entries(res||{}).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<span><i class="dotc ${pcls(partyIn(cands,k))}"></i>${esc(k)} ${esc(v)}%</span>`).join("")}
function pollRow(title,sub,res,cands,url){const l=lead(res,cands);
  return `<div class="pr"><span><span class="src">${esc(title)}</span>${sub?` <span class="dt">· ${esc(sub)}</span>`:""}</span>${l?`<span class="lead ${l.party}">${mgText(l)}</span>`:"<span></span>"}<span class="res">${resHTML(res,cands)}</span>${url?`<a class="link" href="${esc(url)}" target="_blank" rel="noopener">Source ↗</a>`:""}</div>`}
function pollBlock(e,cands,heading){
  let h=`<div class="kv"><span class="sec">${heading||"Polls"}</span>`;
  if(!e||(!(e.avg||[]).length&&!(e.polls||[]).length))return h+`<div class="sub">No public polls found for this race.</div>${e&&e.note?`<div class="sub">${esc(e.note)}</div>`:""}</div>`;
  const own=e.polls&&e.polls.length?ownAvg(e.polls):null;
  h+=`<div class="avgbox"><span class="sec">Aggregate</span><div class="ptab">`;
  if((e.avg||[]).length>1)h+=pollRow(`Combined: the ${e.avg.length} published averages below, averaged`,"",combined(e.avg),cands,"");
  for(const a of e.avg||[])h+=pollRow(a.s,a.d,a.r,cands,a.u);
  if(own)h+=pollRow(`Simple average of the ${e.polls.length} poll${e.polls.length>1?"s":""} below`,"",own,cands,"");
  h+=`</div></div>`;
  if(e.polls&&e.polls.length)h+=`<div class="ptab">${e.polls.map(p=>pollRow(p.p,[p.d,p.n].filter(Boolean).join(" · "),p.r,cands,p.u)).join("")}</div>`;
  if(e.note)h+=`<div class="sub">${esc(e.note)}</div>`;
  return h+`</div>`;
}

/* ===================== TALLIES ===================== */
function tallyFor(p,view){
  if(view==="senate"){let d=HOLD.D,r=HOLD.R,i=0,t=0;for(const s in SEN_UP){const v=p.sen[s]||"T";if(v==="D")d++;else if(v==="R")r++;else if(v==="I")i++;else t++}return {d,r,i,t,total:100}}
  if(view==="house"){let d=0,r=0,i=0;for(const s in p.house){d+=p.house[s].D;r+=p.house[s].R;i+=p.house[s].I}return {d,r,i,t:435-d-r-i,total:435}}
  const L=LOCAL[view];let d=0,r=0,i=0,t=0;for(const x of L.races){const v=p[view][x[0]]||"T";if(v==="D")d++;else if(v==="R")r++;else if(v==="I")i++;else t++}return {d,r,i,t,total:L.races.length};
}

function nextEmpty(){for(let i=1;i<NSLOTS;i++)if(!summaryOf(S.profiles[i].p).any)return i;return -1}

/* share codes */
function b64e(str){return btoa(unescape(encodeURIComponent(str))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function b64d(str){str=str.replace(/-/g,"+").replace(/_/g,"/");while(str.length%4)str+="=";return decodeURIComponent(escape(atob(str)))}
function makeCode(i){const pr=S.profiles[i];return "MM26-"+b64e(JSON.stringify({n:pr.name||(i?`Player ${i}`:"Main"),p:pr.p}))}
function readCode(c){c=(c||"").trim();const m=c.match(/MM26-([A-Za-z0-9_-]+)/);if(!m)throw 0;const o=JSON.parse(b64d(m[1]));return {name:String(o.n||"").slice(0,24),p:cleanPicks(o.p)}}
function renderShare(){
  const box=$("share");box.innerHTML="";
  const p=document.createElement("div");p.className="panel";
  let h=`<div><h3>Share</h3><div class="sub">Copy a code for the map you're on and text it to someone. When they paste it here, it loads into a slot so you can compare.</div></div>
    <div class="actions"><button class="btn primary" id="sh-copy">Copy code for ${esc(slotLabel(S.active))}</button></div>
    <div class="kv"><label class="sec" for="sh-in">Paste a code</label><textarea class="code" id="sh-in" placeholder="MM26-…"></textarea>
    <div class="actions"><button class="btn" id="sh-load">Load into next empty slot</button>${S.active?`<button class="btn" id="sh-load-here">Replace ${esc(slotLabel(S.active))}</button>`:""}</div></div>`;
  if(live.on&&!live.owner){
    h+=`<div class="kv"><span class="sec">Live board</span>`;
    if(!live.uid)h+=`<div class="sub">Sign in to Claude to post your map.</div>`;
    else if(S.active===0)h+=`<div class="sub">Switch to one of your slots to post it.</div>`;
    else h+=`<div class="actions"><button class="btn" id="sh-post">${live.postedSlot===S.active?"Posted · updates as you edit":"Post "+esc(slotLabel(S.active))+" to the live board"}</button></div>`;
    if(live.status)h+=`<div class="sub">${esc(live.status)}</div>`;
    h+=`</div>`;
  }
  p.innerHTML=h;box.appendChild(p);
  $("sh-copy").onclick=()=>copyText(makeCode(S.active),"Code copied");
  const load=into=>{try{const r=readCode($("sh-in").value);const slot=into??nextEmpty();if(slot<0)return toast("All 10 slots are in use. Clear one first.");
      S.profiles[slot]=r;S.active=slot;$("sh-in").value="";save();render();toast(`Loaded ${r.name||"map"} into ${slotLabel(slot)}`)}
    catch(e){toast("That code didn't read. Check that the whole code was pasted.")}};
  $("sh-load").onclick=()=>load(null);
  if($("sh-load-here"))$("sh-load-here").onclick=()=>load(S.active);
  if($("sh-post"))$("sh-post").onclick=()=>{live.postedSlot=S.active;try{localStorage.setItem(KEY+"-posted",JSON.stringify(S.active))}catch(e){}pushNow();renderShare();toast("Posted to the live board")};
}

function copyText(txt,msg){try{navigator.clipboard.writeText(txt).then(()=>toast(msg),()=>fallback(txt,msg))}catch(e){fallback(txt,msg)}}
function fallback(txt,msg){const ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();
  let ok=false;try{ok=document.execCommand("copy")}catch(e){}ta.remove();toast(ok?msg:"Copy is blocked in this view")}
function copySummary(){
  const p=P(),s=tallyFor(p,"senate"),h=tallyFor(p,"house");
  const fl=Object.keys(SEN_UP).filter(k=>p.sen[k]&&p.sen[k]!==SEN_UP[k]).map(k=>`${k}→${p.sen[k]}`);
  const lines=[`${slotLabel(S.active)}'s 2026 midterm map`,`Senate: D ${s.d} – R ${s.r}${s.i?` – I ${s.i}`:""}${s.t?` (${s.t} toss-up)`:""}${fl.length?` · flips: ${fl.join(", ")}`:""}`,`House: D ${h.d} – R ${h.r}${h.i?` – I ${h.i}`:""}${h.t?` (${h.t} toss-up)`:""}`];
  for(const v of ["lh","ls","la","lg"]){const x=tallyFor(p,v),L=LOCAL[v];if(x.t===x.total)continue;
    lines.push(L.gov?`NY governor counties: Hochul ${x.d} – Blakeman ${x.r}`:`${L.title}: D ${x.d} – R ${x.r}${x.i?` – I ${x.i}`:""}${x.t?` (${x.t} toss-up)`:""}`)}
  copyText(lines.join("\n"),"Copied to clipboard");
}
function noteText(){
  const v=curView();
  if(v==="senate")return "35 seats are up: all 33 Class II seats plus special elections in Ohio and Florida. Striped bar sections are the 65 seats not on the ballot (34 Democratic, including two independents, and 31 Republican). Candidate lists as of Nov. 2; write-ins left out.";
  if(v==="house")return "Several states redrew their maps for 2026, so district numbers don't line up with today's members. Set each state's split by seat count. Today's delegations come from Sept. 2 member rosters; TX-23 and FL-20 are vacant.";
  return LOCAL[v].footer;
}

$("scope-nat").onclick=()=>{S.scope="nat";sel=null;save();render()};
$("scope-loc").onclick=()=>{S.scope="loc";sel=null;save();render()};
$("layer-held").onclick=()=>{S.layers.held=!S.layers.held;save();render()};
$("layer-ballot").onclick=()=>{S.layers.ballot=!S.layers.ballot;save();render()};
$("layer-polls").onclick=()=>{S.layers.polls=!S.layers.polls;save();render()};
$("who-select").onchange=e=>{S.active=+e.target.value;sel=null;save();render()};
let nameT;$("who-name").oninput=e=>{if(!editable())return;S.profiles[S.active].name=e.target.value.slice(0,24);clearTimeout(nameT);nameT=setTimeout(()=>{save();renderWho();renderCompare();renderShare()},400)};
render();
</script>
